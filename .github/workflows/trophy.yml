name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate the trophy SVG from GitHub contributions
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Krrish-Devani
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push trophy.svg if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update trophy.svg"
            git push
          else
            echo "No changes to commit"
          fi
